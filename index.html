<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบวิชาการดิจิทัล</title>
<meta name="description" content="ระบบรวมลิงก์ระบบวิชาการดิจิทัลของโรงเรียน">
<meta name="theme-color" content="#ffffff">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- iOS / Android: เปิดแบบเต็มจอเมื่อเพิ่มลงหน้าจอหลัก -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วิชาการดิจิทัล">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{--teal:#0C7C82;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif}
  #frame{position:fixed;left:0;right:0;bottom:0;top:var(--safe-t);width:100%;height:calc(100% - var(--safe-t));border:0;background:#fff}


  /* Offline overlay */
  #offline{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 20% 10%,#fff 0%,#EAF9EE 50%,#CDEFD6 100%);color:#334155}
  #offline.show{display:flex}
  #offline img{width:6rem;height:6rem;border-radius:22%;box-shadow:0 8px 22px rgba(31,120,70,.25)}
  #offline h1{margin:.8rem 0 0;font-size:1.25rem;color:#0C5F66}
  #offline p{margin:0 0 1rem;color:#64748b}

  button.pill{border:0;border-radius:999px;padding:.7rem 1.6rem;font:600 .95rem inherit;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0C7C82,#35B4B0);box-shadow:0 8px 18px rgba(12,124,130,.35)}

  /* Install banner */
  #install{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:15;display:none;align-items:center;gap:.75rem;
    max-width:420px;margin:0 auto;padding:.7rem .8rem;border-radius:1.1rem;background:#fff;color:#334155;box-shadow:0 14px 40px rgba(15,23,42,.3)}
  #install.show{display:flex;animation:up .35s ease both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  #install img{width:2.6rem;height:2.6rem;border-radius:22%;flex-shrink:0}
  #install .t{flex:1;min-width:0;font-size:.85rem;line-height:1.3}
  #install .t b{display:block;color:#0C5F66}
  #install .x{border:0;background:#f1f5f9;color:#64748b;width:2rem;height:2rem;border-radius:999px;cursor:pointer;font-size:1rem}
  #install button.pill{padding:.5rem 1rem;font-size:.85rem;box-shadow:none}
</style>
</head>
<body>

<iframe id="frame" title="ระบบวิชาการดิจิทัล"
  allow="clipboard-write; fullscreen; camera; microphone; geolocation"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="offline" role="alert">
  <img src="icons/icon-192.png" alt="">
  <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
  <p>กรุณาตรวจสอบสัญญาณแล้วลองใหม่อีกครั้ง</p>
  <button class="pill" id="retryBtn">ลองใหม่</button>
</div>

<div id="install" role="dialog" aria-label="ติดตั้งแอป">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>ติดตั้งแอปวิชาการดิจิทัล</b><span id="installHint">เปิดได้เร็วจากหน้าจอหลัก แบบเต็มจอ</span></div>
  <button class="pill" id="installBtn">ติดตั้ง</button>
  <button class="x" id="installClose" aria-label="ปิด">×</button>
</div>

<script>
/* ===== ตั้งค่า: ลิงก์ Web App ของ Apps Script (ลงท้ายด้วย /exec) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbxNbKfpBeLXK7zqtLqxzN7i35H9axHgV52pzbBZ9bfEOf1e-IR7-RK0_BsF6jTsEgIrcg/exec';

const $ = id => document.getElementById(id);
const frame = $('frame'), offline = $('offline');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- โหลดแอป ---------- */
function loadApp() { frame.src = APP_URL; }

/* ---------- ออฟไลน์ ---------- */
function syncOnline() {
  offline.classList.toggle('show', !navigator.onLine);
}
addEventListener('online', () => { offline.classList.remove('show'); loadApp(); });
addEventListener('offline', syncOnline);
$('retryBtn').onclick = () => { if (navigator.onLine) { offline.classList.remove('show'); loadApp(); } };

/* ---------- ปุ่มติดตั้ง ---------- */
let deferred = null;
const banner = $('install');
const dismissed = () => { try { return Date.now() - Number(localStorage.getItem('da_install_x') || 0) < 7 * 864e5; } catch (e) { return false; } };
const dismiss = () => { banner.classList.remove('show'); try { localStorage.setItem('da_install_x', Date.now()); } catch (e) {} };
$('installClose').onclick = dismiss;

addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  if (!standalone && !dismissed()) setTimeout(() => banner.classList.add('show'), 4000);
});
$('installBtn').onclick = async () => {
  if (deferred) {
    deferred.prompt();
    await deferred.userChoice.catch(() => {});
    deferred = null; banner.classList.remove('show');
  } else { dismiss(); }
};
addEventListener('appinstalled', () => { banner.classList.remove('show'); deferred = null; });

// iOS Safari ไม่มี beforeinstallprompt → แสดงคำแนะนำ
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS && !standalone && !dismissed()) {
  $('installHint').textContent = 'แตะปุ่มแชร์ แล้วเลือก “เพิ่มไปยังหน้าจอโฮม”';
  $('installBtn').textContent = 'ตกลง';
  setTimeout(() => banner.classList.add('show'), 4000);
}

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- เริ่มทำงาน ---------- */
loadApp();
syncOnline();
</script>
</body>
</html>
