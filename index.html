<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบวิชาการดิจิทัล</title>
<meta name="theme-color" content="#0C7C82">
<meta name="application-name" content="ระบบวิชาการดิจิทัล">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วิชาการดิจิทัล">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0C7C82;overflow:hidden;font-family:'Sarabun',system-ui,sans-serif}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#fff}
  .ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
      background:linear-gradient(135deg,#0C7C82,#35B4B0);color:#fff;text-align:center;padding:2rem;transition:opacity .4s}
  .ov.hide{opacity:0;visibility:hidden;pointer-events:none}
  .ov img{width:110px;height:110px;border-radius:24px;background:#fff;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .ov button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:.7rem 1.6rem;background:#fff;color:#0C7C82;cursor:pointer}
  #install{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
      display:none;align-items:center;gap:.6rem;background:#fff;color:#0C7C82;border-radius:999px;padding:.55rem .6rem .55rem 1.1rem;
      box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;font-size:.95rem}
  #install button{font:inherit;border:0;border-radius:999px;padding:.45rem 1rem;cursor:pointer;background:#0C7C82;color:#fff;font-weight:700}
  #install .x{background:#e2e8f0;color:#475569;padding:.45rem .8rem}
</style>
</head>
<body>
<iframe id="app" title="ระบบวิชาการดิจิทัล" allow="clipboard-write; fullscreen; camera; microphone; geolocation"></iframe>

<div id="splash" class="ov"><img src="icons/icon-192.png" alt=""><div>กำลังโหลดระบบวิชาการดิจิทัล…</div></div>
<div id="offline" class="ov hide"><img src="icons/icon-192.png" alt=""><div style="font-weight:700;font-size:1.2rem">ไม่มีการเชื่อมต่ออินเทอร์เน็ต</div>
  <div style="opacity:.9">กรุณาตรวจสอบเครือข่ายแล้วลองอีกครั้ง</div><button id="retry">ลองใหม่</button></div>
<div id="install"><span id="installText">ติดตั้งแอปไว้บนหน้าจอ</span><button id="installBtn">ติดตั้ง</button><button class="x" id="installX">ปิด</button></div>

<script>
/* ===== ตั้งค่า ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzYfJTRZ2_xcmAQ_BDXOrlUf75fDDGI3RcLHiCjXFFOEl_uJLE_tAB-Aub4rKBIQ1iFfw/exec';

const $ = id => document.getElementById(id);
const frame = $('app');
let loaded = false, timer;

function hide(el){ el.classList.add('hide'); }
function show(el){ el.classList.remove('hide'); }
function loadApp(){
  loaded = false; show($('splash')); hide($('offline'));
  if (!navigator.onLine) { hide($('splash')); show($('offline')); return; }
  frame.src = GAS_URL;
  clearTimeout(timer);
  timer = setTimeout(() => { if (!loaded) { hide($('splash')); } }, 15000); // กันค้างหน้า splash
}
frame.addEventListener('load', () => { loaded = true; setTimeout(() => hide($('splash')), 600); });
$('retry').onclick = loadApp;
addEventListener('online', () => { if (!loaded) loadApp(); });
addEventListener('offline', () => { if (!loaded) { hide($('splash')); show($('offline')); } });

/* ตัวดูลิงก์ภายในแอปส่งสัญญาณมาเมื่อเปิด/ปิด (ไว้ต่อยอด เช่น ซ่อนปุ่มติดตั้ง) */
let viewerOpen = false;
addEventListener('message', e => {
  if (e.data && e.data.da === 'viewer') { viewerOpen = !!e.data.open; if (viewerOpen) $('install').style.display = 'none'; }
});

/* ===== Install prompt ===== */
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
let deferred = null;
function offerInstall(text, withBtn){
  if (standalone || localStorage.getItem('da_install_dismissed') === '1') return;
  $('installText').textContent = text;
  $('installBtn').style.display = withBtn ? '' : 'none';
  setTimeout(() => { if (!viewerOpen) $('install').style.display = 'flex'; }, 4000);
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; offerInstall('ติดตั้งแอปไว้บนหน้าจอ', true); });
$('installBtn').onclick = async () => {
  if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('install').style.display = 'none';
};
$('installX').onclick = () => { $('install').style.display = 'none'; try { localStorage.setItem('da_install_dismissed','1'); } catch(e){} };
addEventListener('appinstalled', () => { $('install').style.display = 'none'; });
if (isIOS) offerInstall('iPhone/iPad: แตะปุ่มแชร์ แล้วเลือก "เพิ่มลงหน้าจอโฮม"', false);

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
loadApp();
</script>
</body>
</html>
