<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ระบบวิชาการดิจิทัล</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4FBF5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="วิชาการดิจิทัล">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F4FBF5;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  iframe{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#F4FBF5}
  #msg{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.05rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:linear-gradient(160deg,#E4F7F1 0%,#F4FBF5 48%,#FBF8E1 100%);transition:opacity .5s ease,visibility .5s}
  #msg.hide{opacity:0;visibility:hidden;pointer-events:none}
  .ld-ring{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 16px 36px -14px rgba(12,124,130,.55),inset 0 0 0 9px #f3fbf8}
  .ld-ring::before{content:'';position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,rgba(53,180,176,0) 0%,#35B4B0 45%,#AED581 85%,rgba(174,213,129,0) 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:ldSpin 1.05s linear infinite}
  .ld-ico{width:80px;height:80px;border-radius:22%;background:url(icons/icon-192.png) center/cover no-repeat;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);animation:ldPulse 1.7s ease-in-out infinite}
  .ld-txt{font-weight:700;color:#0C7C82;font-size:1.08rem;letter-spacing:.02em}
  .ld-txt i{font-style:normal;animation:ldDot 1.3s infinite both}.ld-txt i:nth-child(2){animation-delay:.18s}.ld-txt i:nth-child(3){animation-delay:.36s}
  .ld-bar{position:relative;width:190px;height:6px;border-radius:99px;overflow:hidden;background:rgba(12,124,130,.14)}
  .ld-bar span{position:absolute;top:0;bottom:0;width:42%;border-radius:99px;background:linear-gradient(90deg,#35B4B0,#AED581);animation:ldBar 1.15s ease-in-out infinite}
  @keyframes ldSpin{to{transform:rotate(360deg)}}@keyframes ldPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes ldDot{0%,80%,100%{opacity:.2}40%{opacity:1}}@keyframes ldBar{0%{left:-42%}100%{left:100%}}
</style>
</head>
<body>
<div id="msg"><div class="ld-ring"><div class="ld-ico"></div></div><div class="ld-txt">กำลังโหลด<i>.</i><i>.</i><i>.</i></div><div class="ld-bar"><span></span></div></div>
<iframe id="app" onload="setTimeout(function(){document.getElementById('msg').classList.add('hide')},350)" src="https://script.google.com/macros/s/AKfycbyEwsEd6tQ-TcqmfSb8RTisrSyr3EeSEqjXBsZATft8t_EtFWrtYuEHyE65zSmrXkdG5g/exec" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade" title="ระบบวิชาการดิจิทัล"></iframe>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<script>
  /* ปิดป๊อปอัพ/แถบแนะนำให้ติดตั้งแอปของเบราว์เซอร์ (ยังติดตั้งได้จากเมนูของเบราว์เซอร์ตามปกติ) */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });
</script>
<script>setTimeout(function(){var m=document.getElementById('msg');if(m)m.classList.add('hide')},15000);</script>
</body>
</html>
