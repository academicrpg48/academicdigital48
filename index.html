<!DOCTYPE html>
<html lang="th">
<head>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบวิชาการดิจิทัล</title>
<meta name="description" content="ระบบรวมลิงก์ระบบวิชาการดิจิทัลของโรงเรียน">
<meta name="theme-color" content="#ffffff">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- iOS / Android: เปิดแบบเต็มจอเมื่อเพิ่มลงหน้าจอหลัก -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วิชาการดิจิทัล">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{--teal:#0C7C82;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif}
  #frame{position:fixed;left:0;right:0;bottom:0;top:var(--safe-t);width:100%;height:calc(100% - var(--safe-t));border:0;background:#fff}


  /* Offline overlay */
  #offline{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 20% 10%,#fff 0%,#EAF9EE 50%,#CDEFD6 100%);color:#334155}
  #offline.show{display:flex}
  #offline img{width:6rem;height:6rem;border-radius:22%;box-shadow:0 8px 22px rgba(31,120,70,.25)}
  #offline h1{margin:.8rem 0 0;font-size:1.25rem;color:#0C5F66}
  #offline p{margin:0 0 1rem;color:#64748b}

  button.pill{border:0;border-radius:999px;padding:.7rem 1.6rem;font:600 .95rem inherit;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0C7C82,#35B4B0);box-shadow:0 8px 18px rgba(12,124,130,.35)}

  #splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 90% at 20% 10%,#FFFFFF 0%,#EAF9EE 50%,#CDEFD6 100%);transition:opacity .6s ease,visibility .6s,transform .6s ease;}
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.04);}
  .sp-blob{position:absolute;border-radius:999px;filter:blur(50px);opacity:.45;animation:spFloat 9s ease-in-out infinite;}
  .sp-b1{width:18rem;height:18rem;background:#9BE7B0;top:-5rem;left:-5rem;}
  .sp-b2{width:20rem;height:20rem;background:#FFE88A;bottom:-7rem;right:-6rem;animation-delay:-3s;}
  .sp-b3{width:12rem;height:12rem;background:#7FDDD0;top:45%;right:-3rem;opacity:.35;animation-delay:-6s;}
  @keyframes spFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.12)}}
  .sp-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.75rem;animation:spIn .8s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes spIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
  .splash-ring{position:relative;width:12rem;height:12rem;display:flex;align-items:center;justify-content:center;}
  .splash-ring::before{content:"";position:absolute;inset:0;border-radius:999px;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 90deg,#1FA45A 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.3s linear infinite;}
  .splash-ring::after{content:"";position:absolute;inset:-14px;border-radius:999px;border:1.5px solid rgba(31,164,90,.35);animation:spPulse 2.2s ease-out infinite;}
  @keyframes spPulse{0%{transform:scale(.88);opacity:.9}100%{transform:scale(1.22);opacity:0}}
  .splash-logo{width:10rem;height:10rem;border-radius:999px;background:#fff;box-shadow:0 14px 36px rgba(31,120,70,.22),0 0 0 6px rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;animation:spBreath 2.6s ease-in-out infinite;}
  @keyframes spBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .splash-logo img{width:72%;height:72%;object-fit:contain;border-radius:22%;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  #splashText{color:#17804A;font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-align:center;}
  .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
  .sp-bar{width:11rem;height:5px;border-radius:99px;background:rgba(31,164,90,.18);overflow:hidden;}
  .sp-bar::after{content:"";display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#6FD39A,#1FA45A);animation:spBar 1.4s ease-in-out infinite;}
  @keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion:reduce){#splash *,#splash *::before,#splash *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;}.splash-ring::before{animation:spin 2.5s linear infinite!important;}}
  @keyframes spin{to{transform:rotate(360deg)}}
  #splash{background-color:#EAF9EE}
</style>
</head>
<body>

<div id="splash" role="status" aria-label="กำลังเปิดแอป">
  <span class="sp-blob sp-b1"></span><span class="sp-blob sp-b2"></span><span class="sp-blob sp-b3"></span>
  <div class="sp-wrap">
    <div class="splash-ring"><div class="splash-logo"><img src="icons/icon-192.png" alt=""></div></div>
    <div id="splashText">กำลังโหลด<span class="dots"></span></div>
    <div class="sp-bar"></div>
  </div>
</div>


<iframe id="frame" title="ระบบวิชาการดิจิทัล"
  allow="clipboard-write; fullscreen; camera; microphone; geolocation"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="offline" role="alert">
  <img src="icons/icon-192.png" alt="">
  <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
  <p>กรุณาตรวจสอบสัญญาณแล้วลองใหม่อีกครั้ง</p>
  <button class="pill" id="retryBtn">ลองใหม่</button>
</div>

<script>
/* ===== ตั้งค่า: ลิงก์ Web App ของ Apps Script (ลงท้ายด้วย /exec) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbw9aV9I7OlVhfV9bZ1RlLxeU9Thqtm8FmXr-ZgI4rzefV5Xi391NOzVCqHc5qgOCnV1/exec';

const $ = id => document.getElementById(id);
const frame = $('frame'), offline = $('offline');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- โหลดแอป ---------- */
const loading = $('splash');
let ldTimer;
function hideLoading() { loading.classList.add('hide'); clearTimeout(ldTimer); }
// iframe โหลดเสร็จ → รอสั้น ๆ ให้เนื้อหาในแอปวาดเสร็จก่อนค่อยเปิดจอ
// ปิดหน้าโหลดเมื่อแอปส่งสัญญาณ "พร้อม" (หน้าโหลดเดียวต่อเนื่อง) ถ้าแอปเวอร์ชันเก่าไม่ส่ง ให้ปิดหลังโหลดเฟรมเสร็จ 6 วินาที
addEventListener('message', e => { if (e.data && e.data.da === 'ready') setTimeout(hideLoading, 150); });
frame.addEventListener('load', () => { if (frame.src) setTimeout(hideLoading, 6000); });
function loadApp() {
  loading.classList.remove('hide');
  clearTimeout(ldTimer); ldTimer = setTimeout(hideLoading, 12000);   // กันค้าง
  frame.src = APP_URL;
}

/* ---------- ออฟไลน์ ---------- */
function syncOnline() {
  offline.classList.toggle('show', !navigator.onLine);
}
addEventListener('online', () => { offline.classList.remove('show'); loadApp(); });
addEventListener('offline', syncOnline);
$('retryBtn').onclick = () => { if (navigator.onLine) { offline.classList.remove('show'); loadApp(); } };

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- เริ่มทำงาน ---------- */
loadApp();
syncOnline();
</script>
</body>
</html>
