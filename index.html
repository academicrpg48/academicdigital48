<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบวิชาการดิจิทัล</title>
<meta name="description" content="ระบบรวมลิงก์ระบบวิชาการดิจิทัลของโรงเรียน">
<meta name="theme-color" content="#ffffff">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- iOS / Android: เปิดแบบเต็มจอเมื่อเพิ่มลงหน้าจอหลัก -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วิชาการดิจิทัล">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{--teal:#0C7C82;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif}
  #frame{position:fixed;left:0;right:0;bottom:0;top:var(--safe-t);width:100%;height:calc(100% - var(--safe-t));border:0;background:#fff}


  /* Offline overlay */
  #offline{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 20% 10%,#fff 0%,#EAF9EE 50%,#CDEFD6 100%);color:#334155}
  #offline.show{display:flex}
  #offline img{width:6rem;height:6rem;border-radius:22%;box-shadow:0 8px 22px rgba(31,120,70,.25)}
  #offline h1{margin:.8rem 0 0;font-size:1.25rem;color:#0C5F66}
  #offline p{margin:0 0 1rem;color:#64748b}

  button.pill{border:0;border-radius:999px;padding:.7rem 1.6rem;font:600 .95rem inherit;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0C7C82,#35B4B0);box-shadow:0 8px 18px rgba(12,124,130,.35)}

  /* Install popup */
  .ip{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + var(--safe-b))}
  .ip[hidden]{display:none}
  .ip-back{position:absolute;inset:0;background:rgba(6,40,48,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:ipFade .3s ease both}
  .ip-card{position:relative;width:100%;max-width:440px;max-height:calc(100% - 24px);overflow-y:auto;background:#fff;color:#1e293b;border-radius:1.75rem;padding:1.6rem 1.3rem 1.2rem;text-align:center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:ipUp .42s cubic-bezier(.2,.9,.3,1.1) both}
  .ip-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:1.75rem 1.75rem 0 0;background:linear-gradient(90deg,#0288D1,#12B5A6,#7CCB3F,#FFC21A,#FF8A4C)}
  @keyframes ipUp{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes ipFade{from{opacity:0}to{opacity:1}}
  @media(min-width:640px){.ip{align-items:center}}
  .ip-x{position:absolute;top:12px;right:12px;width:2.2rem;height:2.2rem;border:0;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:1.3rem;line-height:1;cursor:pointer}
  .ip-logo{width:4.8rem;height:4.8rem;border-radius:1.3rem;box-shadow:0 12px 26px -10px rgba(12,124,130,.6)}
  .ip-card h2{margin:.9rem 0 .2rem;font-size:1.3rem;color:#0C5F66}
  .ip-sub{margin:0;color:#64748b;font-size:.95rem}
  .ip-perks{list-style:none;margin:.9rem 0 0;padding:0;display:grid;gap:.35rem;text-align:left;font-size:.92rem}
  .ip-perks li{display:flex;gap:.55rem;align-items:center;background:#F0F9F8;border-radius:.8rem;padding:.45rem .7rem}
  .ip-perks li::before{content:"";width:.55rem;height:.55rem;border-radius:99px;background:#1FA45A;flex-shrink:0}
  .ip-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:1.1rem 0 .8rem;padding:4px;background:#f1f5f9;border-radius:1rem}
  .ip-tabs button{border:0;background:transparent;border-radius:.75rem;padding:.55rem .2rem;font:600 .85rem inherit;color:#64748b;cursor:pointer}
  .ip-tabs button[aria-selected="true"]{background:#fff;color:#0C7C82;box-shadow:0 2px 8px rgba(15,23,42,.12)}
  .ip-body{text-align:left;font-size:.92rem}
  .ip-steps{margin:0;padding:0;list-style:none;display:grid;gap:.5rem;counter-reset:s}
  .ip-steps li{counter-increment:s;display:flex;gap:.7rem;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:.9rem;padding:.55rem .7rem}
  .ip-steps li::before{content:counter(s);flex-shrink:0;display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:99px;background:#E53935;color:#fff;font-weight:800;font-size:.85rem}
  .ip-steps svg{width:1.25rem;height:1.25rem;vertical-align:-.25em;color:#007AFF}
  .ip-steps b{color:#0C5F66}
  .ip-note{margin-top:.6rem;background:#FFF5D9;color:#5C4300;border-radius:.8rem;padding:.55rem .75rem;font-size:.85rem}
  .ip-go{display:block;width:100%;border:0;border-radius:1rem;padding:.9rem 1rem;font:700 1.05rem inherit;color:#fff;cursor:pointer;
    background:linear-gradient(120deg,#0C7C82,#1FA45A);box-shadow:0 12px 24px -10px rgba(12,124,130,.8)}
  .ip-go.alt{margin-top:.5rem;background:#F0F9F8;color:#0C7C82;box-shadow:none}
  .ip-later{margin-top:.7rem;border:0;background:transparent;color:#64748b;font:600 .9rem inherit;cursor:pointer;padding:.4rem .8rem}
  .ip-never{display:block;margin:.1rem auto 0;border:0;background:transparent;color:#94a3b8;font:500 .8rem inherit;cursor:pointer;text-decoration:underline}
  .ip button:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.ip-card,.ip-back{animation:none}}
  .ip-fab{position:fixed;right:12px;bottom:calc(14px + var(--safe-b));z-index:40;display:flex;align-items:center;gap:.45rem;border:0;border-radius:999px;padding:.7rem 1.05rem;font:700 .95rem inherit;color:#fff;cursor:pointer;
    background:linear-gradient(120deg,#0C7C82,#1FA45A);box-shadow:0 12px 26px -8px rgba(12,124,130,.85);animation:ipUp .4s ease both}
  .ip-fab[hidden]{display:none}
  .ip-fab svg{width:1.15rem;height:1.15rem}
  .ip-fab:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
  #loading{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#fff;transition:opacity .45s ease,visibility .45s}
  #loading.done{opacity:0;visibility:hidden;pointer-events:none}
  #loading img{width:6.5rem;height:6.5rem;border-radius:22%;box-shadow:0 14px 30px -10px rgba(12,124,130,.55);animation:ldPulse 1.8s ease-in-out infinite}
  #loading .ld-bar{width:9rem;height:5px;border-radius:99px;background:#E6F3F2;overflow:hidden}
  #loading .ld-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#0288D1,#12B5A6,#7CCB3F);animation:ldSlide 1.2s ease-in-out infinite}
  #loading p{margin:0;color:#0C5F66;font-weight:600;font-size:1rem}
  @keyframes ldPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion:reduce){#loading img,#loading .ld-bar i{animation:none}}
</style>
</head>
<body>

<iframe id="frame" title="ระบบวิชาการดิจิทัล"
  allow="clipboard-write; fullscreen; camera; microphone; geolocation"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="loading" role="status" aria-live="polite">
  <img src="icons/icon-192.png" alt="">
  <p>กำลังโหลดระบบวิชาการดิจิทัล…</p>
  <div class="ld-bar"><i></i></div>
</div>

<div id="offline" role="alert">
  <img src="icons/icon-192.png" alt="">
  <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
  <p>กรุณาตรวจสอบสัญญาณแล้วลองใหม่อีกครั้ง</p>
  <button class="pill" id="retryBtn">ลองใหม่</button>
</div>

<button id="ipFab" class="ip-fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>คัดลอกลิงก์</span></button>
<div id="ip" class="ip" role="dialog" aria-modal="true" aria-labelledby="ipTitle" hidden>
  <div class="ip-back" id="ipBack"></div>
  <div class="ip-card">
    <button class="ip-x" id="ipX" aria-label="ปิด">&times;</button>
    <img class="ip-logo" src="icons/icon-192.png" alt="">
    <h2 id="ipTitle">ติดตั้งแอปวิชาการดิจิทัล</h2>
    <p class="ip-sub">ติดตั้งลงเครื่องของคุณตอนนี้ แล้วเปิดใช้ได้ทันทีจากหน้าจอหลัก</p>
    <ul class="ip-perks">
      <li>เปิดเร็ว แตะไอคอนเดียว</li>
      <li>เต็มจอ ไม่มีแถบเบราว์เซอร์</li>
      <li>ไม่ต้องโหลดจาก App Store หรือ Play Store</li>
    </ul>
    <div class="ip-tabs" role="tablist" aria-label="เลือกอุปกรณ์">
      <button role="tab" data-p="ios">iPhone / iPad</button>
      <button role="tab" data-p="android">Android</button>
      <button role="tab" data-p="desktop">คอมพิวเตอร์</button>
    </div>
    <div class="ip-body" id="ipBody"></div>
    <button class="ip-later" id="ipLater">ไว้ทีหลัง</button>
    <button class="ip-never" id="ipNever">ไม่ต้องแสดงอีก</button>
  </div>
</div>

<script>
/* ===== ตั้งค่า: ลิงก์ Web App ของ Apps Script (ลงท้ายด้วย /exec) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbytzSfRXF5y-gI9wgK-xIJ-QIBSHXnyyG8MUQ0iKzk5gHmJ-41gGy8eJQ8ORWGljxQB6Q/exec';

const $ = id => document.getElementById(id);
const frame = $('frame'), offline = $('offline');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- โหลดแอป ---------- */
const loading = $('loading');
let ldTimer;
function hideLoading() { loading.classList.add('done'); clearTimeout(ldTimer); }
// iframe โหลดเสร็จ → รอสั้น ๆ ให้เนื้อหาในแอปวาดเสร็จก่อนค่อยเปิดจอ
frame.addEventListener('load', () => { if (frame.src) setTimeout(hideLoading, 900); });
function loadApp() {
  loading.classList.remove('done');
  clearTimeout(ldTimer); ldTimer = setTimeout(hideLoading, 20000);   // กันค้าง
  frame.src = APP_URL;
}

/* ---------- ออฟไลน์ ---------- */
function syncOnline() {
  offline.classList.toggle('show', !navigator.onLine);
}
addEventListener('online', () => { offline.classList.remove('show'); loadApp(); });
addEventListener('offline', syncOnline);
$('retryBtn').onclick = () => { if (navigator.onLine) { offline.classList.remove('show'); loadApp(); } };

/* ---------- ป๊อปอัปติดตั้งแอป ---------- */
const ua = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /android/i.test(ua);
const isInApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok|Messenger/i.test(ua);
const isSafariLike = isIOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua) && !isInApp;
const isSamsung = /SamsungBrowser/i.test(ua);
const detected = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';

const ip = $('ip'), ipBody = $('ipBody');
let deferred = null, current = detected;
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
const snoozed = () => {
  try {
    if (sessionStorage.getItem('da_ip_s')) return true;
    return Date.now() < Number(localStorage.getItem('da_ip_never') || 0);
  } catch (e) { return false; }
};

function steps(list) { return '<ol class="ip-steps">' + list.map(s => '<li><span>' + s + '</span></li>').join('') + '</ol>'; }

function renderBody() {
  let h = '';
  const canPrompt = !!deferred && current === detected;
  if (canPrompt) {
    h = '<button class="ip-go" id="ipGo">คัดลอกลิงก์</button><p class="ip-note" style="text-align:center">กดปุ่ม แล้วเลือก “ติดตั้ง” ในหน้าต่างที่ขึ้นมา</p>';
  } else if (current === 'ios') {
    if (isInApp) {
      h = '<div class="ip-note">คุณเปิดลิงก์ในแอปอื่น (เช่น LINE หรือ Facebook) ให้คัดลอกลิงก์ แล้วเปิดใน <b>Safari</b> จึงจะติดตั้งได้</div><button class="ip-go alt" id="ipCopy">คัดลอกลิงก์</button>';
    } else {
      h = '<button class="ip-go" id="ipGo">คัดลอกลิงก์</button><div style="height:.6rem"></div>' + steps(['แตะปุ่มแชร์ ' + SHARE + ' (iPhone อยู่แถบล่าง, iPad อยู่มุมบน)', 'เลื่อนลงแล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b>', 'แตะ <b>เพิ่ม</b> ที่มุมขวาบน']);
      if (!isSafariLike) h += '<div class="ip-note">แนะนำให้เปิดลิงก์นี้ใน <b>Safari</b> เพื่อความแน่นอน</div><button class="ip-go alt" id="ipCopy">คัดลอกลิงก์</button>';
    }
  } else if (current === 'android') {
    if (isInApp) {
      h = '<div class="ip-note">คุณเปิดลิงก์ในแอปอื่น ให้คัดลอกลิงก์ แล้วเปิดใน <b>Chrome</b> จึงจะติดตั้งได้</div><button class="ip-go alt" id="ipCopy">คัดลอกลิงก์</button>';
    } else if (isSamsung) {
      h = steps(['แตะเมนู <b>≡</b> มุมล่างขวา', 'เลือก <b>เพิ่มหน้าไปที่</b> แล้วเลือก <b>หน้าจอหลัก</b>', 'ยืนยัน ไอคอนจะอยู่บนหน้าจอหลัก']);
    } else {
      h = '<button class="ip-go alt" id="ipGo">คัดลอกลิงก์</button><div style="height:.6rem"></div>' + steps(['แตะเมนู <b>⋮</b> (จุดสามจุด) มุมขวาบนของ Chrome', 'เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b>', 'ยืนยัน ไอคอนจะอยู่บนหน้าจอหลัก']);
    }
  } else {
    h = '<button class="ip-go alt" id="ipGo">คัดลอกลิงก์</button><div style="height:.6rem"></div>' + steps(['ใช้ Chrome หรือ Edge เปิดลิงก์นี้', 'คลิกไอคอนติดตั้ง (หน้าจอพร้อมลูกศร) ที่ขวาของแถบที่อยู่', 'คลิก <b>ติดตั้ง</b>']) + '<div class="ip-note">Safari บน Mac: เลือกเมนู ไฟล์ แล้วเลือก “เพิ่มไปยัง Dock”</div>';
  }
  ipBody.innerHTML = h;
  document.querySelectorAll('.ip-tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === current));
  const go = $('ipGo'); if (go) go.onclick = () => copyLink(go);
  const cp = $('ipCopy'); if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(location.href.split('#')[0]); cp.textContent = 'คัดลอกแล้ว'; }
    catch (e) { cp.textContent = 'แตะค้างที่แถบที่อยู่เพื่อคัดลอก'; }
  };
}
async function copyLink(btn) {
  const url = location.href.split('#')[0];
  try { await navigator.clipboard.writeText(url); btn.textContent = 'คัดลอกลิงก์แล้ว'; }
  catch (e) {
    const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); btn.textContent = 'คัดลอกลิงก์แล้ว'; } catch (_) { btn.textContent = 'แตะค้างที่แถบที่อยู่เพื่อคัดลอก'; }
    t.remove();
  }
}
const fab = $('ipFab'); const fabLbl = fab.querySelector('span');
fab.onclick = async () => { await copyLink(fabLbl); setTimeout(() => fabLbl.textContent = 'คัดลอกลิงก์', 2000); };
function openIp(force) {
  if (standalone || !ip.hidden) return;
  fab.hidden = true;
  current = detected; renderBody(); ip.hidden = false;
  const f = $('ipGo') || $('ipLater'); if (f) f.focus({ preventScroll: true });
}
function closeIp(remember) {
  ip.hidden = true; fab.hidden = standalone;
  if (remember) { try { sessionStorage.setItem('da_ip_s', '1'); } catch (e) {} }
}
document.querySelectorAll('.ip-tabs button').forEach(b => b.onclick = () => { current = b.dataset.p; renderBody(); });
$('ipX').onclick = $('ipLater').onclick = $('ipBack').onclick = () => closeIp(true);
$('ipNever').onclick = () => { try { localStorage.setItem('da_ip_never', Date.now() + 30 * 864e5); } catch (e) {} closeIp(true); };
addEventListener('keydown', e => { if (e.key === 'Escape' && !ip.hidden) closeIp(true); });

addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  if (!ip.hidden) renderBody();               // เปิดป๊อปอัปอยู่แล้ว → เปลี่ยนเป็นปุ่ม "ติดตั้งเลย"
});
addEventListener('appinstalled', () => { deferred = null; closeIp(false); fab.hidden = true; });

// เปิดทันทีที่เข้าหน้า (ผ่านเบราว์เซอร์หรือสแกน QR) ยกเว้นเปิดจากแอปที่ติดตั้งแล้ว หรือกด "ไว้ทีหลัง" ในรอบนี้
if (!standalone) { fab.hidden = false; if (!snoozed()) setTimeout(openIp, 400); }

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- เริ่มทำงาน ---------- */
loadApp();
syncOnline();
</script>
</body>
</html>
